[project]
name = "tally-cfo"
version = "0.1.0"
description = "Open source AI CFO in your terminal and your Telegram DMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40,<1.0",
  "python-telegram-bot>=21.0,<22.0",
  "playwright>=1.47,<2.0",
  "click>=8.1,<9.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0",
  "structlog>=24.1,<26.0",
  "jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.scripts]
tally = "tally.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
